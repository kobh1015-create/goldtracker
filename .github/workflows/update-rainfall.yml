name: Update Rainfall Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch KMA & Save to Supabase
        run: |
          node << 'EOF'
          const SPOT_STATION = {
            hot1:255,hot2:245,hot3:245,hot4:251,hot5:247,hot6:247,hot7:238,hot8:245,
            hot9:236,hot10:221,hot11:203,hot12:217,hot13:203,hot14:226,hot15:300,
            hot16:143,hot17:135,hot18:290,hot19:304,hot20:136,hot21:146,hot22:268,
            hot23:271,hot24:263,hot25:119,hot26:216,hot27:273,hot28:216,hot29:216,
            hot30:217,hot31:247,
          }

          const KMA_KEY = process.env.KMA_KEY
          const SB_URL  = process.env.SUPABASE_URL
          const SB_KEY  = process.env.SUPABASE_SERVICE_KEY

          function isoDate(offset = 0) {
            const d = new Date()
            d.setDate(d.getDate() + offset)
            return d.toISOString().slice(0, 10)
          }

          function yyyymmdd(iso) {
            return iso.replace(/-/g, '')
          }

          function parseRn(text) {
            const lines = text.split(/\r?\n/).filter(l => !l.startsWith('#') && l.trim() && !/777/.test(l))
            for (const line of lines) {
              const cols = line.split(',')
              if (cols.length < 39) continue
              const rn = parseFloat(cols[38])
              if (!isNaN(rn) && rn >= 0) return rn
            }
            return 0
          }

          async function fetchDay(stn, iso) {
            const url = `https://apihub.kma.go.kr/api/typ01/url/kma_sfcdd.php?tm=${yyyymmdd(iso)}&stn=${stn}&authKey=${KMA_KEY}`
            try {
              const res  = await fetch(url)
              const text = await res.text()
              return { iso, rn: parseRn(text) }
            } catch {
              return { iso, rn: 0 }
            }
          }

          const uniqueStns = [...new Set(Object.values(SPOT_STATION))]
          const today = isoDate()

          // 각 관측소별로 최근 21일 데이터 수집
          const stationData = {}
          for (const stn of uniqueStns) {
            const days = []
            for (let i = 1; i <= 21; i++) {
              days.push(fetchDay(stn, isoDate(-i)))
            }
            const results = await Promise.all(days)
            const total7d = results.slice(0, 7).reduce((s, d) => s + d.rn, 0)
            const lastRain = results.find(d => d.rn >= 1)
            stationData[stn] = {
              total7d: Math.round(total7d * 10) / 10,
              lastRainDate: lastRain?.iso ?? null,
            }
            console.log(`stn ${stn}: total7d=${stationData[stn].total7d}mm, lastRain=${stationData[stn].lastRainDate}`)
          }

          const rows = Object.entries(SPOT_STATION).map(([spot_id, stn]) => ({
            spot_id,
            total7d:        stationData[stn]?.total7d ?? 0,
            last_rain_date: stationData[stn]?.lastRainDate ?? null,
            updated_at:     today,
          }))

          const res = await fetch(`${SB_URL}/rest/v1/rainfall`, {
            method: 'POST',
            headers: {
              apikey: SB_KEY,
              Authorization: `Bearer ${SB_KEY}`,
              'Content-Type': 'application/json',
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify(rows),
          })
          console.log('Supabase:', res.status)
          EOF
        env:
          KMA_KEY:              ${{ secrets.KMA_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
